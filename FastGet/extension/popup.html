<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; font: 13px system-ui, sans-serif; color: #111; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1d4ed8; color: #fff; font-weight: 600; }
  header img { width: 20px; height: 20px; }
  #status { margin-left: auto; font-weight: 400; font-size: 11px; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #e5e7eb; }
  h2 { font-size: 11px; color: #6b7280; text-transform: uppercase; margin: 10px 12px 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { flex: none; background: #1d4ed8; color: #fff; border: 0; border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  #empty { color: #6b7280; padding: 6px 12px 12px; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><span>FastGet</span><span id="status">Checking…</span></header>
  <label>Capture browser downloads <input id="intercept" type="checkbox"></label>
  <h2>Media on this page</h2>
  <div id="list"></div>
  <div id="empty">Play the video, then reopen this menu.</div>
  <script src="popup.js"></script>
</body>
</html>
