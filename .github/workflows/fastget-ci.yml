name: FastGet CI

on:
  push:
    branches: [main]
    paths: ['FastGet/**', '.github/workflows/fastget-*.yml']
  pull_request:
    paths: ['FastGet/**', '.github/workflows/fastget-*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test FastGet/tests/FastGet.Tests -c Release
